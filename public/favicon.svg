  </desc>

  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#303678"/>
      <stop offset="50%" stop-color="#242968"/>
      <stop offset="100%" stop-color="#151A56"/>
    </linearGradient>

    <linearGradient id="whiteSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F7FA"/>
    </linearGradient>
  </defs>

  <!-- =====================================================
       MAIN EMBLEM
       ===================================================== -->

  <!-- Outer shield / water body -->
  <path
